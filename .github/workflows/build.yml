name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux
      options: --privileged
    steps:
      - name: Install archiso + deps
        run: pacman -Syu --noconfirm archiso git grub dosfstools edk2-ovmf mtools libisoburn squashfs-tools rsync

      - name: Checkout
        uses: actions/checkout@v4

      # Calamares is not in core/extra, so build it from the AUR into a local repo
      # (profile/pacman.conf points at /opt/localrepo). The AUR web UI is behind a
      # bot wall, so we clone from the official GitHub mirror of the AUR instead.
      - name: Build Calamares (AUR) into a local repo
        shell: bash
        run: |
          set -eu
          pacman -S --noconfirm --needed base-devel sudo git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sudo -u builder bash -euc '
            git clone --depth 1 --branch calamares --single-branch \
              https://github.com/archlinux/aur.git ~/calamares
            cd ~/calamares
            makepkg -s --noconfirm --needed
          '
          mkdir -p /opt/localrepo
          cp /home/builder/calamares/*.pkg.tar.zst /opt/localrepo/
          rm -f /opt/localrepo/*-debug-*.pkg.tar.zst
          repo-add /opt/localrepo/hyggshi-local.db.tar.gz /opt/localrepo/*.pkg.tar.zst
          ls -la /opt/localrepo

      - name: Build ISO
        run: mkarchiso -v -w work/ -o out/ profile/

      - name: Checksums
        run: cd out && sha256sum *.iso > SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: hyggshi-os-arch-iso
          path: out/
