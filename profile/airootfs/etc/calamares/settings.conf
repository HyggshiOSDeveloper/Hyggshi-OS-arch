---
modules-search: [ local ]

instances:
  - id: prep
    module: shellprocess
    config: shellprocess_prep.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@prep
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphookcfg
      - initcpiocfg
      - initcpio
      - users
      - hwclock
      - shellprocess@cleanup
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: hyggshi
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
