[options]
HoldPkg           = pacman glibc
Architecture      = auto
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Calamares is not in the official repos. The CI workflow builds it from the AUR
# into /opt/localrepo (see .github/workflows/build.yml). For local builds, create
# the same repo first: makepkg calamares, then repo-add /opt/localrepo/hyggshi-local.db.tar.gz *.pkg.tar.zst
[hyggshi-local]
SigLevel = Optional TrustAll
Server = file:///opt/localrepo
