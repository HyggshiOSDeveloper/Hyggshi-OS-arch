[options]
HoldPkg           = pacman glibc
Architecture      = auto
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Calamares is not in the official repos. Needs chaotic-keyring +
# chaotic-mirrorlist on the BUILD host (the CI workflow sets this up).
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
